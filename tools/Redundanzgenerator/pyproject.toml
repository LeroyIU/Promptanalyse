[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redundanzgenerator"
version = "0.1.0"
description = "Generator for controlled redundancy (paraphrases, demonstrations, instructions) in few-shot prompts, based on PopQA and PopQA-TP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
hf = ["datasets>=2.14"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
redundanzgen = "redundanzgenerator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redundanzgenerator = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
