[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redundanzgenerator"
version = "0.2.0"
description = "Generator for controlled redundancy (context passages, demonstrations, instructions) in context-based prompts, built on MuSiQue"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
hf = ["datasets>=2.14"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
redundanzgen = "redundanzgenerator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redundanzgenerator = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
