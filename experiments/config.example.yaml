# Vorlage für die experiment.json einer Pipeline (hier als lesbares YAML).
# Die Enums definieren die Verzweigung 4 x 4 = 16 Kompressate pro Raw-Prompt.

experiment_id: run-2026-07
description: Robustheit von LLMs gegenüber redundanten, komprimierten Prompts.

dataset: musique                   # MuSiQue-Ans dev, Kontext-Prompts mit 20 Passagen
musique_source: datasets/musique/musique_ans_v1.0_dev.jsonl
inference_model: claude-...        # das für Stage 4 verwendete Modell
seed: 42                           # globaler Seed für Reproduzierbarkeit
token_counter: whitespace          # oder z. B. tiktoken/cl100k_base

# Aufbau des Basis-Prompts (Stage 1).
n_demos: 0                         # 0 = Zero-Shot; der Kontext soll dominieren
include_distractors: true          # false = nur Supporting-Passagen (Orakel-Kontext)

# 4 Varianten-Bedingungen pro Raw-Prompt: die Basis (Kontrolle, ohne
# hinzugefügte Redundanz) plus die drei Redundanztypen des Redundanzgenerators.
# Die drei Typen adressieren die drei Bestandteile eines Kontext-Prompts.
# "baseline" dient in der Auswertung als Referenzlevel des Faktors.
redundancy_types:
  - baseline         # Kontrolle: Raw-Prompt ohne Redundanz, gleich komprimiert
  - passages         # redundante Kopien von Kontext-Passagen (Gold zuerst)
  - demonstrations   # zusätzliche Demonstrationen gleicher Hop-Zahl (MuSiQue)
  - instructions     # wiederholte/umformulierte Instruktionen

# Dosierung pro Redundanztyp.
redundancy_counts:
  passages: 3
  passage_mode: duplicate          # oder "restate" (Template-Umformulierung)
  passage_target: supporting       # oder "any"
  passage_position: interleave     # oder "append"
  demonstrations: 3
  demonstration_context: false     # Demonstrationen ohne eigene Passagen
  instructions: 2
  instruction_position: both

# 4 Kompressionsraten = Anteil behaltener Tokens (0..1).
compression_rates: [0.2, 0.4, 0.6, 0.8]
